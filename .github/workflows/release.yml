name: Publier une version

on:
  push:
    tags:
      - "*"
  # Lancement manuel : publie la version indiquée dans manifest.json.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compiler le plugin
        run: |
          npm install
          npm run build

      - name: Créer la release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$(node -p "require('./manifest.json').version")"
          fi
          gh release create "$tag" \
            --title="$tag" \
            --target="$GITHUB_SHA" \
            main.js manifest.json styles.css
